<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>衛材管理・後台</title>
</head>
<body>
<script>
// 後台入口：嵌在急診點班管理頁的「衛材管理」那一頁。載入和 index.html 同一份程式，先設 MANAGE（不用登入、只看不改）。
fetch('index.html',{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(t){
  t=t.replace('<head>','<head><script>window.MANAGE=true<\/script>').replace('<link rel="manifest" href="manifest.json">','').replace('<title>衛材管理</title>','<title>衛材管理・後台</title>');
  document.open(); document.write(t); document.close();
}).catch(function(){ document.body.textContent='載入失敗，請確認網路後重新整理。'; });
</script>
</body>
</html>
